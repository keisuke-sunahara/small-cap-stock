# 共通の設定。実験ごとの違いは experiments/EXP-xxx/config.yaml に差分だけを書く。
# 値の意味と決めた理由は docs/PLAN.md・docs/DECISIONS.md を参照。

project:
  timezone: Asia/Tokyo
  random_seed: 42

data:
  provider: jquants
  api_base_url: https://api.jquants.com/v2
  plan: standard              # 2026-10-04 契約を確認
  rate_limit_per_min: 120     # Standardプランの上限
  rate_limit_safety: 0.8      # 上限の8割までに抑える
  fins_rate_limit_per_min: 60 # /fins/ 以下は個別に60件/分
  # 取得の開始日。2026-10-04 時点の Standard の取得範囲（2016-10-04〜）の翌日（DECISIONS.md）
  start_date: "2016-10-05"
  # ホールドアウト（最終評価用）の開始日。2026-10-04 に固定。以後変更しない（DECISIONS.md）。
  # この日以降のデータはフェーズ5まで取得・読み込み・集計・グラフ化をしない。
  holdout_start: "2025-09-29"
  raw_dir: data/raw/jquants
  # 決算短信の発行済株式数の基準のずれの補正（src/backtest/market.py の share_basis）。直前の短信との差が tol を超え、
  # 期末日の翌営業日〜開示日、または期末日の before_days 営業日前〜前の営業日の累積積で計算し直すと tol 以内になる場合に
  # 直す。tol が null なら補正しない（2026-10-05 ユーザーの承認、評価役のフェーズ3の指摘・低1。DECISIONS.md）
  shares_split_fix_tol: 0.05
  shares_split_fix_before_days: 5

backtest:
  # 過去の売買単位データが無いため、売買単位が100株に統一された2018-10-01以降に限定する（DECISIONS.md参照）
  trade_start_date: "2018-10-01"
  # 継続保有の判断（src/backtest/engine.py）。none / prev_day / same_day。
  # prev_day（最終営業日の前の営業日の引け後の順位で判断）で確定（2026-10-04 承認、CLAUDE.md 第5章）。
  # same_day は引け値を見てから引けで売ることになり実行できないため、参考値にだけ使う
  continuation: prev_day
  # 予算の決め方。min_equity：min(運用資金, 総資産) ÷ N（基本ルール）。fixed：運用資金 ÷ N に固定。
  # 戦略どうしの比較は fixed で行い、min_equity を併記する（2026-10-04 承認、CLAUDE.md 第5章）
  budget_mode: min_equity

capital:
  initial_capital_jpy: 300000
  n_holdings: 3

order:
  limit_up_pct: 0.02          # 買い指値 = 前営業日終値 × (1 + 0.02) を呼値で切り下げ
  lot_size: 100
  max_order_to_adv: 0.01      # 1銘柄の注文金額 ≤ 過去20営業日平均売買代金の1%
  adv_window: 20

cost:
  one_way: 0.003              # 片道。手数料0円（楽天証券ゼロコース）＋自分の注文による寄付・引けの値動き（DECISIONS.md）
  one_way_stress: 0.005       # 併記用
  # 基本は一律（flat）。比較用に tick（片道 = max(one_way, 1呼値 ÷ 約定価格)）を併記する（評価役のフェーズ2の指摘1）
  model: flat

tax:
  rate: 0.20315

universe:
  common_stock_only: true
  max_market_cap_jpy: 50000000000   # 500億円
  min_avg_turnover_jpy: 30000000    # 3,000万円（過去20営業日平均）
  turnover_window: 20
  min_price_jpy: 50
  # 予測日の銘柄一覧で貸借信用区分が「その他（3）」の銘柄を除く（2026-10-04 承認、CLAUDE.md 第5章）
  exclude_margin_other: true
  # 本番（ペーパートレード・実運用）だけ、翌営業日の一覧（予測日の17:30頃に公開）の「その他」も除く。
  # バックテストでは使わない（過去の一覧は翌営業日8:00の更新の後の版のため。2026-10-04 承認、CLAUDE.md 第5章）
  exclude_margin_other_next_day_in_production: true
  # 調整係数のある日をまたぐ調整後リターンが ±30% を超えた銘柄を、分かった日から60営業日除く。
  # 学習用データでは、目的変数の期間にその係数の日がある行も除く（2026-10-04 承認、reports/phase1_review.md 3.3 の案A）
  bad_adjfactor_threshold: 0.3
  bad_adjfactor_exclude_days: 60

target:
  horizon_days: 5

validation:
  gap_days: 5                 # 学習期間の終わりと評価期間の始まりの空白（営業日）
  retrain_frequency: monthly
  # 学習に使う最初の起点（60営業日の特徴量がそろう時期。前年同期比は2017年10月ごろから。DECISIONS.md）
  train_start: "2017-01-01"
  # 学習期間は直近4年のローリング（評価の月の最初の予測日の4年前〜空白の前まで。2026-10-04 承認、PLAN.md）。
  # 2026-10-04 まで expanding（拡大窓）と書かれていたのを、承認どおりに直した（フェーズ4は未実行）
  train_window: rolling
  train_window_years: 4

features:
  set: all_v1                 # src/features/registry.py の FEATURE_SETS
  normalize: rank             # 予測日ごとにユニバース内の順位（0〜1）に直す

# フェーズ4のモデル（2026-10-05 追加。実験は experiments/EXP-xxx/config.yaml に差分だけを書く。experiments/README.md）
model:
  type: lightgbm              # lightgbm / ridge
  objective: regression       # lightgbm の目的：regression（順位の二乗誤差）/ lambdarank（日ごとの10分位を順位付け）
  target_shuffle: false       # true：学習用の目的変数を起点の日ごとに並べ替える（情報漏れの確認用。EXP-003）
  train_universe: all         # all / affordable（100株を買える銘柄だけで学習・順位付け。候補8）
  lightgbm:                   # 調整しない固定値（結果を見て変えない）
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    min_data_in_leaf: 1000
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    num_threads: 4
    deterministic: true
    lambdarank_truncation_level: 30
  ridge:
    alpha: 1.0
    nan_fill: 0.5             # 順位に直した特徴量の欠損は中央（0.5）で埋める

# 比較する売買ルールの候補（CLAUDE.md 第5章）。初期値は基本ルール（候補を使わない）
rules:
  market_filter_ma_days: null # 候補1：TOPIX の終値がこの日数の移動平均を下回ったら買わず、継続もしない（20）
  stop_loss: null             # 候補2：買値からこの割合の下落で逆指値の売り（0.08）
  earnings_avoid: false       # 候補3：保有期間中に決算発表の予定がある銘柄を除く
  earnings_avoid_undecided: true  # 候補3で、予定日が「未定」の銘柄も除く（EXP-008 の plan.md）
  buy_order: limit            # 候補4：limit（寄付の指値）/ market（寄付の成行）
  weighting: equal            # 候補6・7：equal / rank（順位による傾斜）/ inverse_vol（値動きの大きさに反比例）
  rank_weights: [0.40, 0.35, 0.25]
  max_weight: 0.5             # 1銘柄の配分の上限（候補6・7）
  holding_weeks: 1            # 候補9：予測と買いを H 週ごとに行う（2・4）

# 評価（フェーズ4。CLAUDE.md 第9章）
evaluation:
  data_cost_annual_jpy: 19800 # 運用時のプラン（Light、月1,650円）の年間データ費用。30万円に対して年6.6%
  top_quantiles: 10           # 予測の分位ごとの成績（10分位）

market:
  # 大引けの時刻（開示の利用開始日の判定に使う）
  close_time_change_date: "2024-11-05"
  close_time_before: "15:00"
  close_time_after: "15:30"
