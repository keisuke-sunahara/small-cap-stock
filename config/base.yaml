# 共通の設定。実験ごとの違いは experiments/EXP-xxx/config.yaml に差分だけを書く。
# 値の意味と決めた理由は docs/PLAN.md・docs/DECISIONS.md を参照。

project:
  timezone: Asia/Tokyo
  random_seed: 42

data:
  provider: jquants
  api_base_url: https://api.jquants.com/v2
  plan: standard              # 2026-10-04 契約を確認
  rate_limit_per_min: 120     # Standardプランの上限
  rate_limit_safety: 0.8      # 上限の8割までに抑える
  fins_rate_limit_per_min: 60 # /fins/ 以下は個別に60件/分
  # 取得の開始日。2026-10-04 時点の Standard の取得範囲（2016-10-04〜）の翌日（DECISIONS.md）
  start_date: "2016-10-05"
  # ホールドアウト（最終評価用）の開始日。2026-10-04 に固定。以後変更しない（DECISIONS.md）。
  # この日以降のデータはフェーズ5まで取得・読み込み・集計・グラフ化をしない。
  holdout_start: "2025-09-29"
  raw_dir: data/raw/jquants

backtest:
  # 過去の売買単位データが無いため、売買単位が100株に統一された2018-10-01以降に限定する（DECISIONS.md参照）
  trade_start_date: "2018-10-01"
  # 継続保有の判断（src/backtest/engine.py）。none / prev_day / same_day。
  # prev_day（最終営業日の前の営業日の引け後の順位で判断）で確定（2026-10-04 承認、CLAUDE.md 第5章）。
  # same_day は引け値を見てから引けで売ることになり実行できないため、参考値にだけ使う
  continuation: prev_day
  # 予算の決め方。min_equity：min(運用資金, 総資産) ÷ N（基本ルール）。fixed：運用資金 ÷ N に固定。
  # 戦略どうしの比較は fixed で行い、min_equity を併記する（2026-10-04 承認、CLAUDE.md 第5章）
  budget_mode: min_equity

capital:
  initial_capital_jpy: 300000
  n_holdings: 3

order:
  limit_up_pct: 0.02          # 買い指値 = 前営業日終値 × (1 + 0.02) を呼値で切り下げ
  lot_size: 100
  max_order_to_adv: 0.01      # 1銘柄の注文金額 ≤ 過去20営業日平均売買代金の1%
  adv_window: 20

cost:
  one_way: 0.003              # 手数料＋スリッページ（片道）
  one_way_stress: 0.005       # 併記用

tax:
  rate: 0.20315

universe:
  common_stock_only: true
  max_market_cap_jpy: 50000000000   # 500億円
  min_avg_turnover_jpy: 30000000    # 3,000万円（過去20営業日平均）
  turnover_window: 20
  min_price_jpy: 50
  # 予測日の銘柄一覧で貸借信用区分が「その他（3）」の銘柄を除く（2026-10-04 承認、CLAUDE.md 第5章）
  exclude_margin_other: true
  # 調整係数のある日をまたぐ調整後リターンが ±30% を超えた銘柄を、分かった日から60営業日除く。
  # 学習用データでは、目的変数の期間にその係数の日がある行も除く（2026-10-04 承認、reports/phase1_review.md 3.3 の案A）
  bad_adjfactor_threshold: 0.3
  bad_adjfactor_exclude_days: 60

target:
  horizon_days: 5

validation:
  gap_days: 5                 # 学習期間の終わりと評価期間の始まりの空白（営業日）
  retrain_frequency: monthly
  # 学習に使う最初の起点（60営業日の特徴量がそろう時期。前年同期比は2017年10月ごろから。DECISIONS.md）
  train_start: "2017-01-01"
  train_window: expanding     # 学習期間は train_start から評価の前まで（月ごとに伸ばす）

features:
  set: all_v1                 # src/features/registry.py の FEATURE_SETS
  normalize: rank             # 予測日ごとにユニバース内の順位（0〜1）に直す

market:
  # 大引けの時刻（開示の利用開始日の判定に使う）
  close_time_change_date: "2024-11-05"
  close_time_before: "15:00"
  close_time_after: "15:30"
